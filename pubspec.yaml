name: puoconnect
description: "A smart campus activity and parking management system."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^4.12.1
  firebase_storage: ^13.4.5
  cloud_firestore: ^6.7.1
  firebase_auth: ^6.5.6
  cupertino_icons: ^1.0.8
  google_fonts: ^8.2.0
  intl: ^0.20.3
  geolocator: ^10.1.0    # 👈 Tukar dari ^14.0.3 ke ^10.1.0 (Stabil & Tiada Konflik)
  file_picker: ^8.0.0
  fl_chart: ^1.2.0
  url_launcher: ^6.3.2
  flutter_facebook_auth: ^6.0.0
  http: ^1.2.0           # 👈 DAH DITAMBAH UNTUK MULTI-POSTING API

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/maps/